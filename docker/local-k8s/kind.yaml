kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: 0.0.0.0
  apiServerPort: 6443
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 0.0.0.0
      - containerPort: 30081
        hostPort: 8081
        listenAddress: 0.0.0.0
      - containerPort: 30090
        hostPort: 9090
        listenAddress: 0.0.0.0
